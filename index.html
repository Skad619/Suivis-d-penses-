<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dépenses</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dépenses">
<meta name="theme-color" content="#F3F5F2">
<style>
:root{--paper:#F3F5F2;--card:#fff;--ink:#1D2A2E;--mute:#6B7B7F;--line:#DCE2DF;--pos:#1F6F5C;--neg:#B4412F;--btn:#1D2A2E;--btnink:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--paper:#121A1C;--card:#1A2427;--ink:#E8EEEC;--mute:#8FA0A3;--line:#2A3739;--pos:#5CC2A6;--neg:#E5806D;--btn:#E8EEEC;--btnink:#121A1C}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 ui-rounded,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 20px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin-inline:auto;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header h1{font-size:17px;font-weight:600;margin:0;text-transform:capitalize}
.nav{font-size:26px;width:44px;height:44px;border-radius:22px;color:var(--mute)}
.hero{padding:18px 0 22px}
.lbl{margin:0;color:var(--mute)}
.rest{margin:2px 0 14px;font-size:clamp(52px,17vw,84px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--pos);line-height:1.05}
.rest.neg{color:var(--neg)}
.two{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.two b{display:block;color:var(--ink);font-weight:600}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:grid;grid-template-columns:62px 1fr auto 36px;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.d{color:var(--mute);font-size:14px}
.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a{font-variant-numeric:tabular-nums;font-weight:600}
.a.in{color:var(--pos)}
.x{color:var(--mute);font-size:22px;height:36px}
#empty{color:var(--mute);padding:20px 0}
.tools{display:flex;gap:10px;margin-top:28px}
.tools button,.tools label{flex:1;text-align:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
#status{color:var(--mute);font-size:14px;min-height:20px;margin:10px 0 0}
#add{position:fixed;left:20px;right:20px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:520px;margin-inline:auto;height:54px;border-radius:16px;background:var(--btn);color:var(--btnink);font-weight:600;font-size:17px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;margin-inline:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px}
.seg label{text-align:center}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:9px;border-radius:10px}
.seg input:checked+span{background:var(--card);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--pos)}
.panel>input{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);width:100%}
#amt{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.err{color:var(--neg);margin:0;min-height:20px}
.row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.row button{height:50px;border-radius:14px;font-weight:600}
.ghost{background:var(--card);border:1px solid var(--line)!important}
#save{background:var(--btn);color:var(--btnink)}
</style>
</head>
<body>
<header>
  <button class="nav" id="prev" aria-label="Mois précédent">‹</button>
  <h1 id="month"></h1>
  <button class="nav" id="next" aria-label="Mois suivant">›</button>
</header>
<section class="hero">
  <p class="lbl">Il te reste</p>
  <p class="rest" id="rest">0 €</p>
  <div class="two"><span>Entrées<b id="inc"></b></span><span>Dépensé<b id="exp"></b></span></div>
</section>
<ul id="list"></ul>
<p id="empty" hidden>Rien ce mois-ci. Ajoute une dépense ou ton salaire avec le bouton ci-dessous.</p>
<div class="tools">
  <button id="export">Exporter</button>
  <label for="file">Importer</label>
  <input id="file" type="file" accept="application/json,.json" hidden>
</div>
<p id="status" role="status"></p>
<button id="add">Ajouter</button>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Nouvelle opération">
    <div class="seg">
      <label><input type="radio" name="t" value="expense" checked><span>Dépense</span></label>
      <label><input type="radio" name="t" value="income"><span>Entrée</span></label>
    </div>
    <input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Montant en euros">
    <input id="note" placeholder="Note (facultatif)" autocomplete="off" aria-label="Note">
    <input id="date" type="date" aria-label="Date">
    <p class="err" id="err" role="alert"></p>
    <div class="row"><button class="ghost" id="cancel">Annuler</button><button id="save">Enregistrer</button></div>
  </div>
</div>

<script>
const KEY='depenses.v1';
const $=s=>document.querySelector(s);
const eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const today=()=>{const d=new Date();return ymOf(d)+'-'+pad(d.getDate())};
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const sum=(rows,type)=>rows.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0);
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:[]}catch{return[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch{msg('Enregistrement impossible : espace de stockage plein ou bloqué.')}}
function msg(t){$('#status').textContent=t}
let tx=load(),ym=ymOf(new Date());

function render(){
  const [y,m]=ym.split('-').map(Number);
  $('#month').textContent=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const rows=tx.filter(t=>t.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date));
  const inc=sum(rows,'income'),exp=sum(rows,'expense'),rest=inc-exp;
  const r=$('#rest');r.textContent=eur.format(rest);r.className='rest'+(rest<0?' neg':'');
  $('#inc').textContent=eur.format(inc);$('#exp').textContent=eur.format(exp);
  $('#empty').hidden=rows.length>0;
  const ul=$('#list');ul.replaceChildren();
  rows.forEach(t=>{
    const li=document.createElement('li');
    const d=document.createElement('span');d.className='d';
    d.textContent=new Date(t.date+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    const n=document.createElement('span');n.className='n';
    n.textContent=t.note||(t.type==='income'?'Entrée':'Dépense');
    const a=document.createElement('span');a.className='a'+(t.type==='income'?' in':'');
    a.textContent=(t.type==='income'?'+':'−')+eur.format(t.amount);
    const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Supprimer');
    x.onclick=()=>{if(confirm('Supprimer cette opération ?')){tx=tx.filter(o=>o.id!==t.id);persist();render()}};
    li.append(d,n,a,x);ul.append(li);
  });
}
function shift(k){const [y,m]=ym.split('-').map(Number);ym=ymOf(new Date(y,m-1+k,1));render()}
$('#prev').onclick=()=>shift(-1);
$('#next').onclick=()=>shift(1);

$('#add').onclick=()=>{
  $('#err').textContent='';$('#amt').value='';$('#note').value='';$('#date').value=today();
  document.querySelector('input[name=t][value=expense]').checked=true;
  $('#sheet').hidden=false;$('#amt').focus();
};
$('#cancel').onclick=()=>{$('#sheet').hidden=true};
$('#save').onclick=()=>{
  const amount=parseFloat($('#amt').value.replace(/\s/g,'').replace(',','.'));
  const date=$('#date').value;
  if(!(amount>0)){$('#err').textContent='Entre un montant supérieur à 0.';return}
  if(!date){$('#err').textContent='Choisis une date.';return}
  tx.push({id:uid(),date,type:document.querySelector('input[name=t]:checked').value,amount:Math.round(amount*100)/100,note:$('#note').value.trim(),category:null});
  persist();ym=date.slice(0,7);$('#sheet').hidden=true;msg('');render();
};

$('#export').onclick=async()=>{
  const payload={schemaVersion:1,exportedAt:new Date().toISOString(),transactions:tx};
  const name='depenses-'+today()+'.json';
  const file=new File([JSON.stringify(payload,null,2)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});msg('Export prêt.');return}
  }catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('Fichier téléchargé.');
};

const valid=t=>t&&typeof t.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&(t.type==='expense'||t.type==='income')&&Number.isFinite(t.amount)&&t.amount>0;
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const p=JSON.parse(await f.text());
    if(p.schemaVersion!==1||!Array.isArray(p.transactions))throw new Error('format');
    const known=new Set(tx.map(t=>t.id));
    const add=p.transactions.filter(t=>valid(t)&&!known.has(t.id)).map(t=>({id:t.id,date:t.date,type:t.type,amount:t.amount,note:String(t.note||''),category:t.category??null}));
    tx=tx.concat(add);persist();render();msg(add.length+' opération(s) importée(s).');
  }catch{msg('Fichier non reconnu : choisis un export de cette appli.')}
};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
